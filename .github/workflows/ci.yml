name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Offline tests
        run: |
          node tests/outbox.test.mjs
          node tests/signature.test.mjs
          node tests/workflow-auth.test.mjs

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:all

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: relay
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgresql://postgres:pw@127.0.0.1:5432/postgres
      # With this set, a missing Postgres is a failure, never a quiet skip.
      RELAY_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Suite on SQLite and Postgres
        run: python -m pytest -q
      - name: README claims match the fixtures
        run: python tools/check_readme_claims.py
      - name: Build the image and send one lead through it
        run: |
          docker build -t relay-ci .
          python tools/container_smoke.py

  # The mutants are split across eight runners so the whole list fits the time limit with room to spare. Every mutant
  # still runs: shard i of 8 takes every eighth mutant starting at i, and each must be caught by a named failing test.
  relay-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: relay
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgresql://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Mutants, shard ${{ matrix.shard }} of 8, each must be caught
        run: python tests/mutants.py --no-baseline --shard ${{ matrix.shard }}/8
